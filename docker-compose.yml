services:
  postgres:
    image: postgres:16-alpine
    container_name: noema-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: noema
      POSTGRES_PASSWORD: noema_dev
      POSTGRES_DB: noema_research
    volumes:
      - noema_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noema -d noema_research"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  noema_pg_data:
